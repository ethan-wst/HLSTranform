# Link-time options only
freqhz=200MHz

[connectivity]
# Specify kernel instantiation first
nk=forward:1:forward_1

# Embedding weights
sp=forward_1.token_embedding_table:HBM[0:1]

# Attention weights
sp=forward_1.wq_weights:HBM[2]
sp=forward_1.wq_scales:HBM[3]
sp=forward_1.wk_weights:HBM[4]
sp=forward_1.wk_scales:HBM[5]
sp=forward_1.wv_weights:HBM[6]
sp=forward_1.wv_scales:HBM[7]
sp=forward_1.wo_weights:HBM[8]
sp=forward_1.wo_scales:HBM[9]

# FFN weights
sp=forward_1.w1_weights:HBM[10]
sp=forward_1.w1_scales:HBM[11]
sp=forward_1.w2_weights:HBM[12]
sp=forward_1.w2_scales:HBM[13]
sp=forward_1.w3_weights:HBM[14]
sp=forward_1.w3_scales:HBM[15]

# RMS norm weights
sp=forward_1.rms_att_weight:HBM[16]
sp=forward_1.rms_ffn_weight:HBM[16]
sp=forward_1.rms_final_weight:HBM[16]

# Classifier weights
sp=forward_1.wcls_weights:HBM[17]
sp=forward_1.wcls_scales:HBM[18]

# KV cache
sp=forward_1.key_cache:HBM[19:22]
sp=forward_1.value_cache:HBM[23:26]

# Output
sp=forward_1.out:HBM[27]

[profile]
exec=all:all
data=all:all:all
stall=all:all

[debug]
protocol=all:all
